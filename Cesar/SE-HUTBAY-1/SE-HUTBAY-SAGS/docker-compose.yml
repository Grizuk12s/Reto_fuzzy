# SE del SAG. Contenedor independiente del Hopper:
#   - Hopper: puerto 5000 (portada comun de la planta)
#   - SAG:    puerto 5001 (este)
# Mismo codigo base que el Hopper, con su propia config/ (volumen) y su propio
# motor. Nombres propios para no reemplazar al contenedor del Hopper.
name: se-sag

services:
  se-sag:
    build: .
    image: se-sag:0.1
    container_name: se-sag
    ports:
      - "5001:5000"          # host:contenedor -> se abre en http://<ip>:5001
    volumes:
      - ./config:/app/config
    environment:
      # Conexion OPC-UA hacia KEPserver (en el host)
      - KEPSERVER_URL=opc.tcp://host.docker.internal:49320
      # NO sembrar los tags PCS7 del Hopper: el SAG arranca vacio y sus tags
      # se cargan desde la pagina de Tags.
      - SEED_TAGS_PLANTA=0
      # Overrides opcionales de Gunicorn (los defaults viven en gunicorn.conf.py)
      # - GUNICORN_THREADS=4
      # - GUNICORN_TIMEOUT=120
      # - GUNICORN_LOGLEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
