# Desde 0.45 el contenedor lleva la version en el nombre (se-espesador-A0-<VER>)
# para seguir que version corre en cada VM con un `docker ps`. El nombre de
# proyecto (name:) va en minusculas porque Compose no acepta mayusculas ahi.
name: se-espesador-a0-45

services:
  se-espesador:
    image: se-espesador:0.45
    container_name: se-espesador-A0-45
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
    environment:
      # Solo aplica si config/espesador/kepserver.json falta o esta corrupto:
      # ese JSON tiene prioridad sobre esta variable.
      - KEPSERVER_URL=opc.tcp://192.168.137.1:49320
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
