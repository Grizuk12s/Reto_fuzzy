<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Traza del Pipeline — SE Espesador</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:10;background:#1e293b;border-bottom:1px solid #334155;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:1.05rem;font-weight:700}
header .sub{font-size:.78rem;color:#94a3b8}
a.back{color:#38bdf8;text-decoration:none;font-size:.82rem}
a.back:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:.75rem;font-weight:700;border:1px solid #475569;background:#0f172a;color:#94a3b8}
.pill.on{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.12);color:#22c55e}
.pill.off{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.12);color:#ef4444}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
main{padding:22px;max-width:1400px;margin:0 auto}
.stage{background:#1e293b;border:1px solid #334155;border-radius:10px;margin-bottom:14px;overflow:hidden}
.stage>summary{cursor:pointer;padding:12px 18px;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:10px;list-style:none}
.stage>summary::-webkit-details-marker{display:none}
.stage>summary::before{content:'▸';color:#64748b;font-size:.9rem;transition:transform .15s}
.stage[open]>summary::before{transform:rotate(90deg)}
.stage .num{margin-left:auto;font-size:.72rem;font-weight:600;color:#64748b;background:#0f172a;border:1px solid #334155;border-radius:999px;padding:2px 10px}
.stage .body{padding:0 18px 16px}
.stage.bad{border-color:#ef4444}
.stage.warn{border-color:#f59e0b}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;color:#94a3b8;font-weight:600;padding:7px 9px;border-bottom:1px solid #334155;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
td{padding:6px 9px;border-bottom:1px solid #1e293b;vertical-align:top}
tr:last-child td{border-bottom:none}
code{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;background:#0f172a;padding:1px 6px;border-radius:4px}
.mono{font-family:ui-monospace,Consolas,monospace}
.ok{color:#22c55e}.bad{color:#ef4444}.warn{color:#f59e0b}.mut{color:#64748b}
.badge{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em}
.b-ok{background:rgba(34,197,94,.15);color:#22c55e}
.b-bad{background:rgba(239,68,68,.15);color:#ef4444}
.b-warn{background:rgba(245,158,11,.15);color:#f59e0b}
.b-mut{background:rgba(100,116,139,.18);color:#94a3b8}
.b-pv{background:rgba(168,85,247,.15);color:#a855f7}
.b-cruda{background:rgba(8,145,178,.18);color:#22d3ee}
.b-lim{background:rgba(99,102,241,.18);color:#818cf8}
.b-sp{background:rgba(34,197,94,.15);color:#22c55e}
.bar{display:inline-block;height:7px;border-radius:3px;background:#38bdf8;vertical-align:middle;margin-right:6px}
.empty{color:#64748b;padding:14px 0;font-size:.82rem}
.banner{border-radius:10px;padding:14px 18px;margin-bottom:16px;font-size:.85rem;border:2px solid}
.banner.bad{border-color:#ef4444;background:rgba(239,68,68,.08)}
.banner.warn{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.banner h3{margin:0 0 5px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.kv{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:9px 12px}
.kv .k{font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.kv .v{font-size:1rem;font-weight:700;font-family:ui-monospace,Consolas,monospace;margin-top:3px}
select,button{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 11px;font-size:.8rem;cursor:pointer}
button:hover{border-color:#38bdf8}
.flow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.flow .step{flex:1;min-width:88px;text-align:center;padding:8px 5px;border-radius:7px;border:1px solid #334155;background:#1e293b;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#64748b}
.flow .step.done{border-color:#22c55e;color:#22c55e}
.flow .step.stop{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.1)}
.flow .step.skip{opacity:.35}
</style>
</head>
<body>

<header>
  <div>
    <h1>Traza del Pipeline</h1>
    <div class="sub" id="sub">Cargando...</div>
  </div>
  <span class="pill" id="run-pill"><span class="dot"></span><span id="run-txt">—</span></span>
  <div style="margin-left:auto;display:flex;gap:9px;align-items:center">
    <select id="auto">
      <option value="2000">Auto-refresco 2 s</option>
      <option value="5000" selected>Auto-refresco 5 s</option>
      <option value="0">Manual</option>
    </select>
    <button onclick="cargar()">Actualizar</button>
    <a class="back" href="/espesador">&larr; Volver</a>
  </div>
</header>

<main>
  <div id="flow" class="flow"></div>
  <div id="banner"></div>
  <div id="stages"></div>
</main>

<script>
let _timer = null;

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function num(v, d) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  return isNaN(n) ? esc(v) : n.toFixed(d === undefined ? 2 : d);
}

// ---------- Etapas del pipeline, en orden ----------
const ETAPAS = [
  {key: 'lectura',    label: 'Lectura'},
  {key: 'filtro',     label: 'Filtro'},
  {key: 'derivadas',  label: 'Derivadas'},
  {key: 'fuzzy',      label: 'Fuzzy'},
  {key: 'permisivos', label: 'Permisivos'},
  {key: 'reglas',     label: 'Reglas'},
  {key: 'defuzzy',    label: 'Defuzzy'},
  {key: 'escritura',  label: 'Escritura'},
];

function renderFlow(tz) {
  const cortado = tz.abortado_en;
  let corte = cortado ? ETAPAS.findIndex(e => e.key === cortado) : -1;
  document.getElementById('flow').innerHTML = ETAPAS.map(function(e, i) {
    let cls = 'step done';
    if (corte >= 0) {
      if (i === corte) cls = 'step stop';
      else if (i > corte) cls = 'step skip';
    }
    return '<div class="' + cls + '">' + e.label + '</div>';
  }).join('');
}

function renderBanner(tz) {
  const box = document.getElementById('banner');
  let html = '';

  const cob = tz.cobertura || {};
  const falt = cob.faltantes || {};
  const pend = Object.keys(falt).filter(k => (falt[k] || []).length);
  if (pend.length) {
    html += '<div class="banner warn"><h3 class="warn">Mapeo incompleto</h3>'
      + pend.map(k => '<div><b>' + k.toUpperCase() + '</b>: '
          + falt[k].map(r => '<code>' + esc(r) + '</code>').join(' ') + '</div>').join('')
      + '<div class="mut" style="margin-top:6px">Asignalos en la pagina de Tags KEPserver.</div></div>';
  }
  if (tz.abortado_en) {
    html += '<div class="banner bad"><h3 class="bad">Tick abortado en: ' + esc(tz.abortado_en) + '</h3>'
      + '<div>' + esc(tz.motivo_aborto || '') + '</div>'
      + '<div class="mut" style="margin-top:6px">El pipeline no llego a evaluar reglas ni a escribir setpoints.</div></div>';
  }
  box.innerHTML = html;
}

// Seleccion de regla (persistente: la pagina se repinta cada pocos segundos y
// una seleccion en variable suelta se perderia en cada refresco).
let _reglaSel = localStorage.getItem('traza_regla_sel') || '';
let _grab = {activos: [], buffers: {}, max: 500};

function seleccionarRegla(id) {
  _reglaSel = String(id || '');
  localStorage.setItem('traza_regla_sel', _reglaSel);
  cargar();
}

async function toggleGrabacion() {
  if (!_reglaSel) return alert('Elegi una regla en la tabla primero.');
  const grabando = _grab.activos.includes(_reglaSel);
  const accion = grabando ? 'stop' : 'start';
  try {
    const r = await fetch('/api/se/grabador/' + encodeURIComponent(_reglaSel) + '/' + accion,
                          {method: 'POST'});
    _grab = await r.json();
  } catch (e) { alert('Error: ' + e.message); }
  cargar();
}

function verHistorial() {
  if (!_reglaSel) return alert('Elegi una regla en la tabla primero.');
  // Ventana propia por regla: se pueden mirar varias abriendo varias pestanas.
  window.open('/espesador/historial?regla=' + encodeURIComponent(_reglaSel), '_blank');
}

function barraReglas(reglas) {
  const hay = (reglas || []).length > 0;
  const grabando = _reglaSel && _grab.activos.includes(_reglaSel);
  const n = _grab.buffers[_reglaSel] || 0;
  const sel = _reglaSel
    ? '<code>' + esc(_reglaSel) + '</code>'
    : '<span class="mut">ninguna regla seleccionada</span>';
  const estado = !_reglaSel ? ''
    : (grabando
        ? '<span class="badge b-bad" style="margin-left:8px">&#9679; GRABANDO</span>'
          + '<span class="mut" style="margin-left:6px">' + n + '/' + _grab.max + ' eventos</span>'
        : (n ? '<span class="mut" style="margin-left:8px">' + n + ' eventos grabados</span>' : ''));
  return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">'
    + '<span class="mut" style="font-size:.78rem">Regla:</span>' + sel + estado
    + '<span style="flex:1"></span>'
    + '<button onclick="toggleGrabacion()"' + (hay ? '' : ' disabled')
    + (grabando ? ' style="border-color:#ef4444;color:#ef4444"' : '') + '>'
    + (grabando ? '&#9632; Detener grabacion' : '&#9679; Grabar historial') + '</button>'
    + '<button onclick="verHistorial()"' + (hay ? '' : ' disabled') + '>Ver historial &#8599;</button>'
    + '</div>';
}

function stage(id, titulo, contenido, n, cls) {
  const abierto = localStorage.getItem('traza_open_' + id) !== '0';
  return '<details class="stage ' + (cls || '') + '" ' + (abierto ? 'open' : '')
    + ' ontoggle="localStorage.setItem(\'traza_open_' + id + '\', this.open?\'1\':\'0\')">'
    + '<summary>' + titulo + (n !== undefined ? '<span class="num">' + n + '</span>' : '') + '</summary>'
    + '<div class="body">' + contenido + '</div></details>';
}

function tablaLectura(filas) {
  if (!filas.length) return '<div class="empty">Sin tags mapeados. Asigna roles en la pagina de Tags.</div>';
  return '<table><thead><tr><th>Tag</th><th>Cat</th><th>Rol</th><th>Valor</th><th>Quality</th><th>Estado</th></tr></thead><tbody>'
    + filas.map(function(f) {
        return '<tr><td class="mono">' + esc(f.tag) + '</td>'
          + '<td><span class="badge b-' + esc(f.categoria) + '">' + esc(f.categoria) + '</span></td>'
          + '<td class="mono">' + esc(f.rol) + '</td>'
          + '<td class="mono">' + num(f.valor, 3) + '</td>'
          + '<td class="' + (f.quality === 'Good' ? 'ok' : 'warn') + '">' + esc(f.quality) + '</td>'
          + '<td>' + (f.ok ? '<span class="badge b-ok">ok</span>'
                           : '<span class="badge b-bad">fallo</span>') + '</td></tr>';
      }).join('') + '</tbody></table>';
}

function tablaFiltro(filas) {
  if (!filas.length) return '<div class="empty">Sin datos.</div>';
  return '<table><thead><tr><th>Rol</th><th>Crudo</th><th>Filtrado (Exp-Q)</th><th>Diferencia</th></tr></thead><tbody>'
    + filas.map(function(f) {
        const d = Number(f.filtrado) - Number(f.crudo);
        return '<tr><td class="mono">' + esc(f.rol) + '</td>'
          + '<td class="mono">' + num(f.crudo, 3) + '</td>'
          + '<td class="mono">' + num(f.filtrado, 3) + '</td>'
          + '<td class="mono ' + (Math.abs(d) > 1e-9 ? 'warn' : 'mut') + '">'
          + (d >= 0 ? '+' : '') + num(d, 3) + '</td></tr>';
      }).join('') + '</tbody></table>';
}

function tablaFuzzy(filas, limites) {
  if (!filas.length) return '<div class="empty">El pipeline no llego a fuzzificar.</div>';
  return '<table><thead><tr><th>Variable</th><th>Valor</th><th>lmin</th><th>lmax</th><th>Dominio</th><th>Pertenencias</th></tr></thead><tbody>'
    + filas.map(function(f) {
        const perts = Object.keys(f.pert || {}).map(function(k) {
          const w = Math.round(Number(f.pert[k]) * 46);
          return '<div><span class="bar" style="width:' + w + 'px"></span>'
            + '<code>' + esc(k) + '</code> <span class="mono mut">' + num(f.pert[k], 3) + '</span></div>';
        }).join('') || '<span class="mut">—</span>';
        return '<tr><td class="mono">' + esc(f.var)
          + (f.es_pendiente ? ' <span class="badge b-mut">pend</span>' : '') + '</td>'
          + '<td class="mono">' + num(f.valor, 3) + '</td>'
          + '<td class="mono mut">' + num(f.lmin, 2) + '</td>'
          + '<td class="mono mut">' + num(f.lmax, 2) + '</td>'
          + '<td><span class="badge b-warn">' + esc(f.dom) + '</span></td>'
          + '<td>' + perts + '</td></tr>';
      }).join('') + '</tbody></table>';
}

function tablaReglas(reglas) {
  if (!reglas.length) return '<div class="empty">El pipeline no llego a evaluar reglas.</div>';
  const orden = {disparo: 0, descartada: 1, no_evaluable: 2, no_evaluada: 3};
  const cls = {disparo: 'b-ok', descartada: 'b-mut', no_evaluable: 'b-bad', no_evaluada: 'b-mut'};
  const rs = reglas.slice().sort(function(a, b) {
    return (orden[a.estado] - orden[b.estado]) || (b.priority - a.priority);
  });
  return barraReglas(rs)
    + '<table><thead><tr><th style="width:26px"></th><th>Regla</th><th>Bloque</th><th>Prio</th><th>Estado</th><th>Motivo</th><th>Belief</th><th>Falta</th></tr></thead><tbody>'
    + rs.map(function(r) {
        const sel = String(r.id) === _reglaSel;
        const rec = _grab.activos.includes(String(r.id));
        const pick = "seleccionarRegla('" + esc(r.id) + "')";
        return '<tr onclick="' + pick + '" style="cursor:pointer'
          + (sel ? ';background:rgba(56,189,248,.10)' : '') + '">'
          + '<td><input type="radio" name="regla-sel" ' + (sel ? 'checked' : '')
          + ' onclick="event.stopPropagation();' + pick + '"></td>'
          + '<td class="mono">' + esc(r.id)
          + (rec ? ' <span class="badge b-bad" style="font-size:.6rem">REC</span>' : '') + '</td>'
          + '<td class="mut">' + esc(r.bloque) + '</td>'
          + '<td class="mono mut">' + num(r.priority, 0) + '</td>'
          + '<td><span class="badge ' + (cls[r.estado] || 'b-mut') + '">' + esc(r.estado) + '</span></td>'
          + '<td>' + esc(r.motivo) + (r.wait_bloqueante ? ' <code>' + esc(r.wait_bloqueante) + '</code>' : '') + '</td>'
          + '<td class="mono">' + (r.belief !== undefined ? num(r.belief, 3) : '—') + '</td>'
          + '<td class="bad mono" style="font-size:.72rem">'
          + (r.variables_faltantes || []).map(esc).join(', ') + '</td></tr>';
      }).join('') + '</tbody></table>';
}

function tablaDefuzzy(sps) {
  if (!sps.length) return '<div class="empty">Sin setpoints.</div>';
  return '<div class="grid">' + sps.map(function(s) {
      const cambio = Math.abs(Number(s.delta)) > 1e-9;
      // Saturado: la regla puede seguir disparando y el valor no se mueve.
      // Es la confusion mas cara de la pagina, asi que se dice explicito.
      const tope = s.en_limite === 'max' ? 'superior' : (s.en_limite === 'min' ? 'inferior' : '');
      const avisoTope = tope
        ? '<div class="bad" style="font-size:.68rem;margin-top:4px">En el limite ' + tope
          + ': el defuzzy ya no puede moverlo. Las acciones siguen disparando sin efecto.</div>'
        : '';
      return '<div class="kv"><div class="k">' + esc(s.sp) + '</div>'
        + '<div class="v">' + num(s.despues, 2) + '</div>'
        + '<div style="font-size:.72rem;margin-top:4px" class="' + (cambio ? 'warn' : 'mut') + '">'
        + num(s.antes, 2) + ' &rarr; ' + num(s.despues, 2)
        + ' (' + (Number(s.delta) >= 0 ? '+' : '') + num(s.delta, 3) + ')</div>'
        + avisoTope
        + '<div class="mut" style="font-size:.68rem;margin-top:3px">limites '
        + num((s.limites || [])[0], 0) + ' — ' + num((s.limites || [])[1], 0) + '</div>'
        + '<div class="mut mono" style="font-size:.66rem;margin-top:3px">'
        + esc(s.tag || 'sin tag') + '</div></div>';
    }).join('') + '</div>';
}

// Ultimos disparos: sobrevive al anillo de trazas. Contesta la pregunta
// "esta funcionando?" cuando la regla dispara cada 10 min y el tick dura 0.1 s.
function tablaDisparos(disparos) {
  if (!disparos.length) {
    return '<div class="empty">Ninguna regla disparo desde que arranco el motor. '
         + 'Si esperabas que si, mira el motivo en el paso 6.</div>';
  }
  const ahora = Date.now() / 1000;
  const rs = disparos.slice().reverse();
  return '<table><thead><tr><th>HACE</th><th>HORA</th><th>REGLA</th><th>ACCIONES</th>'
    + '<th>BELIEF</th><th>EFECTO EN EL SP</th></tr></thead><tbody>'
    + rs.map(function(d) {
        const hace = Math.max(0, ahora - Number(d.ts_wall || 0));
        const hora = d.ts_wall ? new Date(d.ts_wall * 1000).toLocaleTimeString() : '\u2014';
        const sps = d.setpoints || {};
        const efecto = Object.keys(sps).map(function(k) {
          const e = sps[k];
          const movio = Math.abs(Number(e.delta)) > 1e-9;
          return '<span class="' + (movio ? 'ok' : 'mut') + '">' + esc(k) + ' '
            + num(e.antes, 2) + ' &rarr; ' + num(e.despues, 2)
            + ' (' + (Number(e.delta) >= 0 ? '+' : '') + num(e.delta, 3) + ')</span>';
        }).join('<br>') || '\u2014';
        return '<tr><td class="mono">' + (hace < 90 ? Math.round(hace) + ' s'
                                                    : Math.round(hace / 60) + ' min') + '</td>'
          + '<td class="mono">' + esc(hora) + '</td>'
          + '<td class="mono">' + esc(d.regla_id || '?') + '</td>'
          + '<td class="mono" style="color:#fb923c">' + (d.acciones || []).map(esc).join(', ') + '</td>'
          + '<td class="mono">' + num(d.belief, 3) + '</td>'
          + '<td class="mono" style="font-size:.72rem">' + efecto + '</td></tr>';
      }).join('') + '</tbody></table>';
}

function render(tz, disparos) {
  renderFlow(tz);
  renderBanner(tz);

  const lect = tz.lectura || [];
  const fallos = lect.filter(f => !f.ok).length;
  const reglas = tz.reglas || [];
  const disp = reglas.filter(r => r.estado === 'disparo').length;
  const noEval = reglas.filter(r => r.estado === 'no_evaluable').length;
  const waits = tz.waits_activos || [];

  let html = '';

  html += stage('lectura', '1 · Lectura de tags (OPC-UA)',
    tablaLectura(lect), lect.length + ' tags' + (fallos ? ' · ' + fallos + ' con falla' : ''),
    fallos ? 'bad' : '');

  html += stage('filtro', '2 · Filtro Exp-Q',
    tablaFiltro(tz.filtro || []), (tz.filtro || []).length + ' PV');

  const der = tz.derivadas || {};
  const derKeys = Object.keys(der);
  html += stage('derivadas', '3 · Variables derivadas',
    derKeys.length
      ? '<div class="grid">' + derKeys.map(k => '<div class="kv"><div class="k">' + esc(k)
          + '</div><div class="v">' + num(der[k], 3) + '</div></div>').join('') + '</div>'
      : '<div class="empty">Sin derivadas en este tick.</div>',
    derKeys.length);

  html += stage('fuzzy', '4 · Fuzzificacion y pendientes',
    tablaFuzzy(tz.fuzzy || []), (tz.fuzzy || []).length + ' variables');

  const perm = tz.permisivos || {};
  const permKeys = Object.keys(perm);
  html += stage('permisivos', '5 · Permisivos',
    permKeys.length
      ? '<table><thead><tr><th>Permisivo</th><th>Estado</th></tr></thead><tbody>'
        + permKeys.map(k => '<tr><td class="mono">' + esc(k) + '</td><td><span class="badge b-mut">'
            + esc(perm[k]) + '</span></td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">Sin permisivos evaluados.</div>',
    permKeys.length);

  html += stage('reglas', '6 · Motor de reglas',
    tablaReglas(reglas),
    reglas.length + ' evaluadas · ' + disp + ' disparadas'
      + (noEval ? ' · ' + noEval + ' no evaluables' : ''),
    noEval ? 'warn' : '');

  html += stage('waits', '7 · Waits activos',
    waits.length
      ? '<table><thead><tr><th>Wait</th><th>Variable</th><th>Regla</th><th>Restante</th></tr></thead><tbody>'
        + waits.map(w => '<tr><td class="mono">' + esc(w.wait_id) + '</td>'
            + '<td class="mono mut">' + esc(w.variable_controlada) + '</td>'
            + '<td class="mono mut">' + esc(w.regla_id) + '</td>'
            + '<td class="warn mono">' + num(w.restante_s, 1) + ' s de ' + num(w.duracion_s, 0) + ' s</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="empty">Ningun wait activo: todas las reglas pueden disparar.</div>',
    waits.length);

  html += stage('disparos', '7b · Ultimos disparos (historial)',
    tablaDisparos(disparos || []),
    (disparos || []).length || undefined);

  html += stage('defuzzy', '8 · Defuzzy y setpoints',
    tablaDefuzzy(tz.defuzzy || []), (tz.defuzzy || []).length);

  // Write-on-change: en ciclo libre lo normal es NO escribir. Un tick sin
  // escrituras es sano, no un fallo; hay que distinguirlo de un error.
  const wr = tz.escritura || {};
  const err = wr.error;
  const escritos = wr.escritos || [];
  const quietos = wr.sin_cambio || [];
  let wrHtml;
  if (err) {
    wrHtml = '<div class="bad">Error: ' + esc(err) + '</div>';
  } else if (tz.abortado_en) {
    wrHtml = '<div class="empty">No se llego a escribir.</div>';
  } else if (escritos.length) {
    wrHtml = '<div class="ok">Escritos al DCS: <code>' + escritos.map(esc).join('</code>, <code>')
           + '</code></div>'
           + (quietos.length ? '<div class="empty">Sin cambio (no se reescriben): '
                + quietos.length + '</div>' : '');
  } else {
    wrHtml = '<div class="empty">Ningun setpoint cambio: no se escribio nada al DCS ('
           + quietos.length + ' sin cambio).</div>';
  }
  html += stage('escritura', '9 · Escritura al KEPserver', wrHtml,
    escritos.length || undefined, err ? 'bad' : '');

  document.getElementById('stages').innerHTML = html;
}

async function cargar() {
  try {
    const r = await fetch('/api/se/trace?n=1');
    try {
      _grab = await (await fetch('/api/se/grabador')).json();
    } catch (e) { /* el grabador no es critico para ver la traza */ }
    const d = await r.json();
    const pill = document.getElementById('run-pill');
    const txt = document.getElementById('run-txt');
    pill.className = 'pill ' + (d.running ? 'on' : 'off');
    txt.textContent = d.running ? 'SE CORRIENDO' : 'SE DETENIDO';

    const tz = (d.trazas || [])[0];
    if (!tz) {
      document.getElementById('sub').textContent = 'Sin ticks registrados todavia.';
      document.getElementById('banner').innerHTML =
        '<div class="banner warn"><h3 class="warn">Sin datos</h3>'
        + '<div>El motor no ha ejecutado ningun tick. Arrancalo desde la pagina de Tags KEPserver '
        + 'para ver la traza del pipeline.</div></div>';
      document.getElementById('stages').innerHTML = '';
      document.getElementById('flow').innerHTML = '';
      return;
    }
    const hora = new Date(tz.ts_wall * 1000).toLocaleTimeString();
    document.getElementById('sub').textContent =
      'Tick ' + tz.tick + ' · t_s ' + tz.t_s + ' · ' + hora
      + ' · ' + d.disponibles + ' ticks en buffer';
    render(tz, d.ultimos_disparos || []);
  } catch (e) {
    document.getElementById('sub').textContent = 'Error: ' + e.message;
  }
}

function reprogramar() {
  if (_timer) { clearInterval(_timer); _timer = null; }
  const ms = parseInt(document.getElementById('auto').value, 10);
  if (ms > 0) _timer = setInterval(cargar, ms);
}
document.getElementById('auto').addEventListener('change', reprogramar);

cargar();
reprogramar();
</script>
